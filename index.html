<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why You Should Hire Jessica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Title Screen -->
  <div id="titleScreen" class="screen">
    <h1>Why You Should Hire Jessica</h1>
    <p>A Retro Career Adventure</p>
    <button id="startBtn">PLAY GAME</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen hidden">
    <div id="gameWorld">
      <!-- Player Character -->
      <div id="player"></div>
      
      <!-- Jessica NPC -->
      <div id="jessica"></div>

      <!-- Dialogue Box -->
      <div id="dialogueBox" class="hidden">
        <p id="dialogueText">Press 'E' or walk closer to talk!</p>
      </div>
    </div>
    
    <div id="controlsHint">Use ⬅️ / ➡️ Arrow Keys or 'A' / 'D' to Move</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
